services:
  postgres:
    image: postgres:18.6-alpine
    container_name: billingrd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billingrd}
      POSTGRES_USER: ${POSTGRES_USER:-billingrd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billingrd_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - billingrd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billingrd} -d ${POSTGRES_DB:-billingrd}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  billingrd_postgres_data:
