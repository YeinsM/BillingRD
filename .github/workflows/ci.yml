name: CI

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: billingrd_test
          POSTGRES_USER: billingrd
          POSTGRES_PASSWORD: billingrd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billingrd -d billingrd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BILLINGRD_TEST_DB: Host=localhost;Port=5432;Database=billingrd_test;Username=billingrd;Password=billingrd_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore API
        run: dotnet restore backend/src/BillingRD.Api/BillingRD.Api.csproj

      - name: Restore integration tests
        run: dotnet restore tests/BillingRD.Infrastructure.IntegrationTests/BillingRD.Infrastructure.IntegrationTests.csproj

      - name: Build API
        run: dotnet build backend/src/BillingRD.Api/BillingRD.Api.csproj --configuration Release --no-restore

      - name: Diagnose EF pending model
        shell: bash
        run: |
          cd backend
          dotnet tool restore
          dotnet ef migrations add DiagnosticModelDiff             --project src/BillingRD.Infrastructure/BillingRD.Infrastructure.csproj             --startup-project src/BillingRD.Infrastructure/BillingRD.Infrastructure.csproj             --context BillingDbContext             --output-dir Persistence/Migrations/Diagnostic
          echo "===== SNAPSHOT DIFF ====="
          git diff -- src/BillingRD.Infrastructure/Persistence/Migrations/BillingDbContextModelSnapshot.cs || true
          echo "===== GENERATED DIAGNOSTIC MIGRATION ====="
          find src/BillingRD.Infrastructure/Persistence/Migrations/Diagnostic -maxdepth 1 -type f -print -exec sed -n '1,260p' {} \;
          exit 1

      - name: Run PostgreSQL integration tests
        run: dotnet test tests/BillingRD.Infrastructure.IntegrationTests/BillingRD.Infrastructure.IntegrationTests.csproj --configuration Release --no-restore

  frontend:
    name: Frontend (Angular 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
